name: 發佈字型更新工具
on:
  push:
    branches: [main]
    paths: ['tools/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-updater
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: updater
    steps:
      - uses: actions/checkout@v4
      - name: 打包
        run: |
          ver=$(grep -m1 -o 'v[0-9][0-9.]*' tools/Update-TCJBMM.ps1)
          echo "VER=$ver" >> "$GITHUB_ENV"
          mkdir -p pkg/TC-JBMM-Updater
          cp tools/Update-TCJBMM.ps1 tools/TC-JBMM-Updater.ini tools/更新TC_JBMM字型.bat pkg/TC-JBMM-Updater/
          # 用 Python zipfile 打包：非 ASCII 檔名會標 UTF-8 旗標（runner 的 zip 指令會把中文檔名變成 #Uxxxx）
          python3 -c "import zipfile,os;z=zipfile.ZipFile('TC-JBMM-Updater.zip','w',zipfile.ZIP_DEFLATED);[z.write(os.path.join('pkg/TC-JBMM-Updater',f),'TC-JBMM-Updater/'+f) for f in sorted(os.listdir('pkg/TC-JBMM-Updater'))];z.close()"
          python3 -c "import zipfile;print(*zipfile.ZipFile('TC-JBMM-Updater.zip').namelist(),sep='\n')"
      - name: 發佈（固定 tag，不搶最新版標記）
        run: |
          notes="Windows 字型一鍵更新工具 ${VER}（使用說明見 README「Windows 一鍵安裝／更新字型」一節）"
          delays=(5 15 30 60)
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "字型更新工具 ${VER}" --notes "$notes" --latest=false && \
              gh release upload "$TAG" TC-JBMM-Updater.zip --clobber && exit 0
            else
              gh release create "$TAG" TC-JBMM-Updater.zip --title "字型更新工具 ${VER}" --notes "$notes" --latest=false && exit 0
            fi
            [ "$i" -eq 5 ] && { echo "::error::發佈失敗（重試 5 次）"; exit 1; }
            d=${delays[$((i-1))]}; echo "第 ${i} 次失敗，${d} 秒後重試"; sleep "$d"
          done
