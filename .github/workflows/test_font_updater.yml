name: 測試字型更新工具
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Run 1 - fresh install (demo ini 16+4 = 20 fonts)
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $reg = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          $n = @($reg.PSObject.Properties | Where-Object { [string]$_.Value -match '^TC_JBMM_(1011|1111)_' }).Count
          $f = @(Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_*.ttf').Count
          Write-Host "registry=$n files=$f"
          if ($n -ne 20 -or $f -ne 20) { exit 1 }
          if (-not (Test-Path "$env:ProgramData\TC_JBMM_Updater\state_latest.json")) { exit 1 }
      - name: Run 2 - already latest (expect no reinstall)
        run: |
          $before = (Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_*.ttf' | Measure-Object LastWriteTimeUtc -Maximum).Maximum
          $t0 = Get-Date
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sec = ((Get-Date) - $t0).TotalSeconds
          $after = (Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_*.ttf' | Measure-Object LastWriteTimeUtc -Maximum).Maximum
          Write-Host "seconds=$sec unchanged=$($before -eq $after)"
          if ($before -ne $after) { exit 1 }
      - name: Run 3 - Force (expect reinstall 20, no leftovers)
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause -Force
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $reg = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          $n = @($reg.PSObject.Properties | Where-Object { [string]$_.Value -match '^TC_JBMM_(1011|1111)_' }).Count
          $f = @(Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_*.ttf').Count
          Write-Host "registry=$n files=$f"
          if ($n -ne 20 -or $f -ne 20) { exit 1 }
      - name: Run 4 - API unavailable (expect fallback direct download)
        env:
          GITHUB_TOKEN: ''
        run: |
          (Get-Content tools\Update-TCJBMM.ps1 -Raw -Encoding UTF8) -replace 'https://api.github.com/repos/','https://api.github.com/repos-not-exist/' | Set-Content "$env:TEMP\u.ps1" -Encoding utf8BOM
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:TEMP\u.ps1" -NoPause -Force -Config "$PWD\tools\TC-JBMM-Updater.ini"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $f = @(Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_*.ttf').Count
          Write-Host "files=$f"
          if ($f -ne 20) { exit 1 }
      - name: Run 5 - fake acrotray running (expect paused then restored with new PID)
        shell: powershell
        run: |
          $dir = "$env:TEMP\fakeacro"; New-Item -ItemType Directory $dir -Force | Out-Null
          Add-Type -OutputAssembly "$dir\acrotray.exe" -OutputType WindowsApplication -TypeDefinition 'public static class P { public static void Main() { System.Threading.Thread.Sleep(600000); } }'
          $p1 = Start-Process "$dir\acrotray.exe" -PassThru
          Start-Sleep 2
          New-Item -ItemType Directory "$env:TEMP\Acrobat Distiller DC" -Force | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause -Force
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep 5
          $now = @(Get-Process -Name acrotray -ErrorAction SilentlyContinue)
          Write-Host "before PID=$($p1.Id) now PIDs=$($now.Id -join ',') leftover=$(Test-Path "$env:TEMP\Acrobat Distiller DC")"
          if ($now.Count -ne 1 -or $now[0].Id -eq $p1.Id) { exit 1 }
          if (Test-Path "$env:TEMP\Acrobat Distiller DC") { exit 1 }
      - name: Run 6 - no acrotray (expect it is NOT started)
        run: |
          Get-Process -Name acrotray -ErrorAction SilentlyContinue | Stop-Process -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause -Force
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep 3
          $n = @(Get-Process -Name acrotray -ErrorAction SilentlyContinue).Count
          Write-Host "acrotray count=$n"
          if ($n -ne 0) { exit 1 }
      - name: Run 7 - config changed (expect reinstall per new config; unlisted code untouched)
        run: |
          $ini = "$env:TEMP\t7.ini"
          Set-Content $ini -Encoding utf8BOM -Value "[General]`nTag = latest`n[Fonts]`n1011 = regular , Bold  ; comment"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause -Config $ini
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $a = @(Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_1011_*.ttf').Name
          $b = @(Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_1111_*.ttf').Count
          Write-Host "1011=$($a -join ',') 1111count=$b"
          if ($a.Count -ne 2 -or ($a -notcontains 'TC_JBMM_1011_Regular.ttf') -or ($a -notcontains 'TC_JBMM_1011_Bold.ttf') -or $b -ne 4) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause -Config $ini
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run 8 - invalid config (expect exit 1, nothing changed)
        run: |
          $ini = "$env:TEMP\t8.ini"
          Set-Content $ini -Encoding utf8BOM -Value "[General]`nTag = beta`n[Fonts]`n101 = *`n1011 = Regulr"
          $before = @(Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_*.ttf').Count
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Update-TCJBMM.ps1 -NoPause -Config $ini
          $code = $LASTEXITCODE
          $after = @(Get-ChildItem "$env:WINDIR\Fonts" -Filter 'TC_JBMM_*.ttf').Count
          Write-Host "exit=$code before=$before after=$after"
          if ($code -ne 1 -or $before -ne $after) { exit 1 }
