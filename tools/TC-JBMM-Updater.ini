; ===== TC-JBMM 字型更新工具設定檔 =====
; 每次執行會依這份設定下載、移除舊版、安裝新版。分號開頭的行是註解。
; 這份檔案要跟 Update-TCJBMM.ps1 放在同一個資料夾。

[General]
; 要抓哪一版：latest＝正式版（建議）；pre＝開發版（更新頻繁）
Tag = latest

[Fonts]
; 格式：代碼 = 字重清單（用逗號分隔），* 代表全部 16 個字重
; 代碼是 4 位數字，見 README 的「代碼對照表」
; 可用字重：Thin, ThinItalic, ExtraLight, ExtraLightItalic, Light, LightItalic,
;           Regular, Italic, Medium, MediumItalic, SemiBold, SemiBoldItalic,
;           Bold, BoldItalic, ExtraBold, ExtraBoldItalic

; 範例 1：整組全部安裝
1011 = *

; 範例 2：只裝常用的 4 個字重
1111 = Regular, Bold, Italic, BoldItalic

; 範例 3：只裝單一字重
; 0000 = Regular

; 範例 4：暫時不要裝，把整行註解掉就好
; 0100 = *
